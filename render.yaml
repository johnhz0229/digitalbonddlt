services:
  - type: web
    name: tokenized-bond-demo
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20.18.1
      - key: HOST
        value: 0.0.0.0
      - key: SESSION_MINUTES
        value: 30
      - key: MAX_SESSIONS
        value: 12
